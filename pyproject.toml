[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-sales-pipeline"
version = "1.0.0"
description = "End-to-end batch ETL pipeline: CSV + REST API ingestion, validation, quarantine, incremental loading into PostgreSQL, and analytics SQL."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pandas>=3.0,<4",
    "pyarrow>=18",
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "requests>=2.32,<3",
    "boto3>=1.35,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "mypy>=1.13",
    "moto[s3]>=5",
    "pandas-stubs>=2.2",
    "types-requests>=2.32",
]

[project.scripts]
sales-pipeline = "sales_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sales_pipeline = ["py.typed"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "N",        # pep8-naming
    "S",        # bandit (security)
    "SIM",      # simplify
    "RUF",
]
ignore = [
    "S608",  # SQL built from internal identifiers only (never user input); see loading/loader.py
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"src/sales_pipeline/sample_data.py" = ["S311"]  # synthetic data, not cryptography

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
files = ["src"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "pyarrow.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a reachable PostgreSQL (skipped automatically when unavailable)",
]
filterwarnings = ["error::FutureWarning"]

[tool.coverage.run]
source = ["sales_pipeline"]
omit = ["*/cli.py"]
