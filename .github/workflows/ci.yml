name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

# Note on "ci-ephemeral-password" below: it is a throwaway value for the Postgres service
# container that exists only for the duration of a job and is unreachable from outside the
# runner. It is not a secret, which is why it is not stored in GitHub Secrets.

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e . --no-deps
      - name: Ruff (lint)
        run: ruff check src tests scripts
      - name: Ruff (format)
        run: ruff format --check src tests scripts
      - name: Mypy
        run: mypy

  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sales_dw_test
          POSTGRES_USER: sales_user
          POSTGRES_PASSWORD: ci-ephemeral-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sales_user -d sales_dw_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      ENVIRONMENT: ci
      DATABASE_HOST: localhost
      DATABASE_USER: sales_user
      DATABASE_PASSWORD: ci-ephemeral-password
      TEST_DATABASE_NAME: sales_dw_test
      REQUIRE_INTEGRATION_TESTS: "1"  # fail (don't skip) if Postgres is unreachable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e . --no-deps
      - name: Run pytest
        run: pytest --cov --cov-report=term --cov-report=xml --junitxml=junit.xml
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            junit.xml
            coverage.xml

  data-quality:
    name: Data-quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sales_dw
          POSTGRES_USER: sales_user
          POSTGRES_PASSWORD: ci-ephemeral-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sales_user -d sales_dw"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      ENVIRONMENT: ci
      DATABASE_HOST: localhost
      DATABASE_NAME: sales_dw
      DATABASE_USER: sales_user
      DATABASE_PASSWORD: ci-ephemeral-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install package
        run: |
          pip install -r requirements.txt
          pip install . --no-deps
      - name: Run pipeline and data-quality checks
        run: bash scripts/run_data_quality_checks.sh
      - name: Upload quarantined records for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rejected-records
          path: data/rejected/
          if-no-files-found: ignore

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    needs: [lint, test, data-quality]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: cloud-sales-pipeline:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run --rm cloud-sales-pipeline:ci --help
          test "$(docker run --rm --entrypoint id cloud-sales-pipeline:ci -u)" != "0" \
            || { echo "image must not run as root"; exit 1; }
      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet
